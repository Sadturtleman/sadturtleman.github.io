<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <title id="title">배정부터 초대 생성까지의 7일 관측 창</title>
  <desc id="desc">배정된 기기를 분모에 넣는다. 화면 노출은 별도 이벤트로 기록하고, 7일 안에 서버가 초대 링크를 발급하면 그 기기를 분자에 한 번 넣는다.</desc>
  <rect x="0" y="0" width="1040" height="410" rx="28" fill="#f3f5fb"/>
  <text x="43" y="53" font-size="20" fill="#5033c8" font-weight="750">측정 흐름</text>
  <text x="43" y="97" font-size="34" fill="#182033" font-weight="800">배정은 분모, 초대 생성은 분자</text>
  <rect x="44" y="130" width="294" height="143" rx="20" fill="#fff" stroke="#d9deed" stroke-width="2"/>
  <rect x="62" y="146" width="42" height="37" rx="11" fill="#ede7ff"/>
  <text x="75" y="173" font-size="20" fill="#5033c8" font-weight="800">1</text>
  <text x="115" y="173" font-size="24" fill="#5033c8" font-weight="780">배정</text>
  <text x="63" y="216" font-size="20" fill="#182033" font-weight="550">준비된 방을 연 방장에게</text>
  <text x="63" y="244" font-size="20" fill="#182033" font-weight="550">기기별로 A 또는 C를 적용</text>
  <path d="M343 201 L367 201" fill="none" stroke="#878faa" stroke-width="2" stroke-linecap="round"/>
  <path d="M361 195 L367 201" fill="none" stroke="#878faa" stroke-width="2" stroke-linecap="round"/>
  <path d="M361 207 L367 201" fill="none" stroke="#878faa" stroke-width="2" stroke-linecap="round"/>
  <rect x="373" y="130" width="294" height="143" rx="20" fill="#fff" stroke="#d9deed" stroke-width="2"/>
  <rect x="391" y="146" width="42" height="37" rx="11" fill="#e8ecf6"/>
  <text x="404" y="173" font-size="20" fill="#182033" font-weight="800">2</text>
  <text x="444" y="173" font-size="24" fill="#182033" font-weight="780">노출</text>
  <text x="392" y="216" font-size="20" fill="#182033" font-weight="550">카드나 진입점이 화면에</text>
  <text x="392" y="244" font-size="20" fill="#182033" font-weight="550">실제로 올라온 시점</text>
  <path d="M672 201 L696 201" fill="none" stroke="#878faa" stroke-width="2" stroke-linecap="round"/>
  <path d="M690 195 L696 201" fill="none" stroke="#878faa" stroke-width="2" stroke-linecap="round"/>
  <path d="M690 207 L696 201" fill="none" stroke="#878faa" stroke-width="2" stroke-linecap="round"/>
  <rect x="702" y="130" width="294" height="143" rx="20" fill="#fff" stroke="#d9deed" stroke-width="2"/>
  <rect x="720" y="146" width="42" height="37" rx="11" fill="#e0f1ec"/>
  <text x="733" y="173" font-size="20" fill="#076963" font-weight="800">3</text>
  <text x="773" y="173" font-size="24" fill="#076963" font-weight="780">초대 생성</text>
  <text x="721" y="216" font-size="20" fill="#182033" font-weight="550">초대 링크 발급 요청을</text>
  <text x="721" y="244" font-size="20" fill="#182033" font-weight="550">서버가 성공으로 응답</text>
  <rect x="44" y="293" width="952" height="52" rx="20" fill="#eae4ff"/>
  <text x="63" y="326" font-size="22" fill="#5033c8" font-weight="760">배정 시점부터 7일 안에 초대를 만든 기기만 집계 · 기기당 한 번</text>
  <text x="44" y="382" font-size="20" fill="#4f5a72" font-weight="500">노출과 클릭은 전환이 어디에서 끊기는지 확인하는 보조 지표다.</text>
</svg>
